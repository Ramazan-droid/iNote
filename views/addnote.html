<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Create a Note</h1>

    <form action="/addnote" method="POST">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Enter note title" required><br>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="6" placeholder="Enter your note here..." required></textarea><br>

        <button type="submit">Save Note</button>
    </form>

</body>
</html>
